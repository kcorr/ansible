---
- name: Check and reboot for pending kernel updates
  hosts: all
  become: yes
  vars:
    email_recipient: kolton@corr.cloud
    email_sender: noreply@corr.cloud
    mail_server: mail.corr.cloud
  tasks:
    - name: Check for pending kernel update
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Set kernel_update_required for downstream tasks
      set_fact:
        kernel_update_required:
          stdout: "{{ 'true' if reboot_required_file.stat.exists else 'false' }}"

    - name: Debug kernel update requirement
      debug:
        msg: "Kernel update required: {{ kernel_update_required.stdout }}"

    - name: Reboot the machine if kernel update is required
      reboot:
        msg: "Rebooting for kernel update"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 5
        post_reboot_delay: 10
      when: kernel_update_required.stdout == "true"
      register: reboot_status
      changed_when: kernel_update_required.stdout == "true"

    - name: Build combined list of rebooted hosts across the whole play
      set_fact:
        all_rebooted_hosts: >-
          {{ groups['all']
             | map('extract', hostvars)
             | selectattr('kernel_update_required', 'defined')
             | selectattr('kernel_update_required.stdout', 'equalto', 'true')
             | map(attribute='inventory_hostname')
             | list }}
      run_once: true
      delegate_to: localhost

    - name: Send one email notification listing all rebooted servers
      mail:
        host: "{{ mail_server }}"
        port: 25
        to: "{{ email_recipient }}"
        from: "{{ email_sender }}"
        subject: "Reboot Notification: Servers Rebooted"
        body: >
          The following servers were rebooted due to a pending kernel update:
          {{ all_rebooted_hosts | join(', ') }}
      run_once: true
      delegate_to: localhost
      when: all_rebooted_hosts | length > 0
