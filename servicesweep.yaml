---
- name: Check for failed systemd services and alert
  hosts: all
  become: yes
  vars:
    email_recipient: kolton@corr.cloud
    email_sender: noreply@corr.cloud
    mail_server: mail.corr.cloud
  tasks:
    - name: Check for failed systemd units
      command: systemctl --failed --no-legend --plain
      register: failed_units
      changed_when: false
      failed_when: false

    - name: Extract failed unit names
      set_fact:
        failed_unit_names: "{{ failed_units.stdout_lines | map('regex_replace', '^(\\S+)\\s.*$', '\\1') | list }}"

    - name: Flag whether this host has failed units
      set_fact:
        has_failed_units: "{{ failed_unit_names | length > 0 }}"

    - name: Report failed units on this host
      debug:
        msg: "{{ inventory_hostname }} has {{ failed_unit_names | length }} failed unit(s): {{ failed_unit_names | join(', ') }}"
      when: has_failed_units

    - name: Determine if any host in the play has failed units
      set_fact:
        any_host_has_failures: "{{ groups['all'] | map('extract', hostvars, 'has_failed_units') | select | list | length > 0 }}"
      run_once: true
      delegate_to: localhost
      become: false

    - name: Send one email listing all hosts with failed units
      mail:
        host: "{{ mail_server }}"
        port: 25
        to: "{{ email_recipient }}"
        from: "{{ email_sender }}"
        subject: "Alert: Failed systemd services detected"
        body: |
          The following hosts have failed systemd units:

          {% for h in groups['all'] %}
          {% if hostvars[h].has_failed_units | default(false) %}
          {{ h }}: {{ hostvars[h].failed_unit_names | join(', ') }}
          {% endif %}
          {% endfor %}
      run_once: true
      delegate_to: localhost
      become: false
      when: any_host_has_failures
