---
- name: Install & configure Wazuh Agent
  hosts: all
  become: yes

  vars:
    wazuh_manager_ip: "10.0.10.55"

  tasks:
    # -------------------------
    # Debian/Ubuntu
    # -------------------------
    - name: Debian | Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Debian | Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_os_family == "Debian"

    - name: Debian | Download Wazuh GPG key to keyring
      ansible.builtin.get_url:
        url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
        dest: /etc/apt/keyrings/wazuh.gpg
        mode: "0644"
      when: ansible_os_family == "Debian"

    - name: Debian | Add Wazuh APT repository (signed-by)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/wazuh.list
        mode: "0644"
        content: |
          deb [signed-by=/etc/apt/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main
      when: ansible_os_family == "Debian"

    - name: Debian | Update APT cache
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Debian | Install Wazuh agent
      ansible.builtin.apt:
        name: wazuh-agent
        state: present
      when: ansible_os_family == "Debian"

    # -------------------------
    # RHEL-family
    # -------------------------
    - name: RedHat | Import Wazuh GPG key
      ansible.builtin.rpm_key:
        state: present
        key: https://packages.wazuh.com/key/GPG-KEY-WAZUH
      when: ansible_os_family == "RedHat"

    - name: RedHat | Add Wazuh YUM repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/wazuh.repo
        mode: "0644"
        content: |
          [wazuh]
          name=Wazuh repository
          baseurl=https://packages.wazuh.com/4.x/yum/
          gpgcheck=1
          gpgkey=https://packages.wazuh.com/key/GPG-KEY-WAZUH
          enabled=1
      when: ansible_os_family == "RedHat"

    - name: RedHat | Install Wazuh agent
      ansible.builtin.package:
        name: wazuh-agent
        state: present
      when: ansible_os_family == "RedHat"

    # -------------------------
    # Configure agent -> manager address
    # -------------------------
    - name: Configure Wazuh manager address in ossec.conf (idempotent)
      ansible.builtin.blockinfile:
        path: /var/ossec/etc/ossec.conf
        marker: "<!-- {mark} ANSIBLE WAZUH SERVER -->"
        insertafter: "<ossec_config>"
        block: |
          <client>
            <server>
              <address>{{ wazuh_manager_ip }}</address>
              <port>1514</port>
              <protocol>tcp</protocol>
            </server>
          </client>
        backup: yes

    - name: Enable and restart Wazuh agent
      ansible.builtin.systemd:
        name: wazuh-agent
        enabled: yes
        state: restarted
